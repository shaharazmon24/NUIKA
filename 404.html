<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>העמוד לא נמצא — NUIKA</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=IBM+Plex+Sans+Hebrew:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="/site.css?v=8">
  <style>
    .nf { min-block-size: 100svb; display: grid; place-content: center; justify-items: center; gap: 22px; padding: 32px 24px; text-align: center; }
    .nf-mark { inline-size: 128px; block-size: 74px; background: var(--ink); -webkit-mask: url(/images/logo.png) center / contain no-repeat; mask: url(/images/logo.png) center / contain no-repeat; }
    .nf h1 { margin: 0; }
    .nf p { margin: 0; color: var(--muted); max-inline-size: 38ch; }
    .nf-acts { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <main class="nf" id="main">
    <div class="nf-mark" role="img" aria-label="NUIKA"></div>
    <h1>העמוד הזה לא נמצא</h1>
    <p>אולי הכתובת שונתה, או שנכתבה לא נכון. אפשר לחזור לתפריט, או לכתוב לי ואעזור.</p>
    <div class="nf-acts">
      <a class="btn btn--primary" href="/shop.html">לתפריט והזמנות</a>
      <a class="btn btn--outline" href="/index.html">לעמוד הבית</a>
      <a class="btn btn--outline" href="/contact.html">דברו איתי</a>
    </div>
  </main>
</body>
</html>
