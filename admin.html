<!doctype html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>נואיקה — ניהול</title>

  <!-- Deliberately NO <link rel="manifest">.
       iOS 16.4+ reads the manifest of whatever page you add to the home screen
       and then always launches at its start_url, which is the shop. That is why
       saving nuika.co.il/?admin produced an icon that opened the storefront.
       With no manifest here, iOS keeps the exact URL, so this icon always lands
       on the admin sign-in. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ניהול" />
  <meta name="theme-color" content="#6B3A2A" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />

  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #F7F2E8;
      color: #6B3A2A;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.1rem; text-align: center; padding: 2rem;
    }
    img { width: 84px; height: 84px; border-radius: 20px; }
    p { margin: 0; font-size: .95rem; color: #8B7260; }
    a { color: #B0563A; font-size: .9rem; }
    .spin {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2.5px solid #E3D7C3; border-top-color: #6B3A2A;
      animation: r .8s linear infinite;
    }
    @keyframes r { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  </style>
</head>
<body>
  <img src="icon-192.png" alt="נואיקה" />
  <div class="spin" role="status" aria-label="טוען"></div>
  <p>פותח את לוח הניהול…</p>
  <noscript><p>יש להפעיל JavaScript. <a href="./?admin">המשך לניהול</a></p></noscript>

  <script>
    // replace(), not href: this page should not sit in the back stack, so the
    // back gesture from the panel goes where the user expects.
    location.replace('./?admin');
  </script>

  <p><a href="./?admin">אם הדף לא נפתח — לחצי כאן</a></p>
</body>
</html>
