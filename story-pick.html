<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>בחירת תמונות לדף האג'נדה — NUIKA</title>

  <!-- A tool Shahar hands to Noy, not a page of the site: in no nav, linked from
       nowhere, noindex, not precached, same as gallery-captions.html. It reads
       gallery.json (public anyway), keeps her choice on her own device, and the
       only thing it ever sends is a WhatsApp message she taps to send herself.
       No database, no credentials. Delete it once the page has its photos. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#6B2E1E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="./site.css?v=12">

  <style>
    /* Prefixed .sp- so nothing here can reach another page's styles. */
    .sp-wrap, .sp-wrap *, .sp-send, .sp-send *, .sp-slots, .sp-slots * { box-sizing: border-box; }

    body { padding-block-end: 120px; }

    .sp-wrap { max-inline-size: 900px; margin-inline: auto; padding: 24px 16px 0; }
    .sp-head { text-align: center; margin-block-end: 18px; }
    .sp-title { font-family: var(--font-display); font-size: var(--t-page); margin: 0 0 10px; }
    .sp-lede { margin: 0 auto; max-inline-size: 48ch; line-height: 1.8; color: var(--muted); }

    /* The three places a photo goes, always on screen, so she sees at a glance
       what she has chosen and which place she is choosing for. */
    .sp-slots {
      position: sticky; inset-block-start: 0; z-index: 10;
      background: var(--cream);
      padding: 10px 0 12px; margin-block: 14px 16px;
      border-block-end: 1px solid rgba(59,42,36,.14);
    }
    .sp-slots__row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-inline-size: 900px; margin-inline: auto; padding-inline: 16px; }
    .sp-slot {
      min-inline-size: 0; font: inherit; text-align: center; cursor: pointer;
      display: grid; grid-template-rows: auto 1fr; gap: 6px;
      padding: 8px 6px 10px; color: var(--ink); background: transparent;
      border: 1.5px solid rgba(59,42,36,.25); border-radius: 12px;
    }
    .sp-slot[aria-pressed="true"] { border-color: var(--terra); background: #FFFDF8; box-shadow: 0 0 0 2px var(--terra); }
    .sp-slot__name { font-size: var(--t-small); font-weight: 500; }
    .sp-slot__pic {
      inline-size: 100%; aspect-ratio: 16 / 9; border-radius: 8px;
      background: var(--butter); object-fit: cover; display: block;
    }
    .sp-slot__empty {
      inline-size: 100%; aspect-ratio: 16 / 9; border-radius: 8px;
      border: 1px dashed rgba(59,42,36,.35);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--t-label); color: var(--muted);
    }
    .sp-hint { text-align: center; margin: 0 auto 14px; max-inline-size: 52ch; font-size: var(--t-small); line-height: 1.7; color: var(--muted); }

    .sp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 640px) { .sp-grid { grid-template-columns: repeat(3, 1fr); } }
    .sp-tile {
      position: relative; padding: 0; cursor: pointer; display: block;
      border: 0; border-radius: 10px; overflow: clip; background: var(--butter);
      aspect-ratio: 16 / 9; font: inherit;
    }
    /* While she is choosing the middle photo, the tiles show it the way it will
       be cut on the page: a tall rectangle taken from the centre. */
    .sp-grid.is-middle .sp-tile { aspect-ratio: 4 / 5; }
    .sp-tile img { inline-size: 100%; block-size: 100%; object-fit: cover; display: block; }
    .sp-tile:focus-visible { outline: 3px solid var(--terra); outline-offset: 2px; }
    .sp-tile.is-picked { box-shadow: 0 0 0 3px var(--terra); }
    .sp-badge {
      position: absolute; inset-block-start: 8px; inset-inline-start: 8px;
      background: var(--terra); color: #fff; font-size: var(--t-label);
      padding: 3px 10px; border-radius: 999px; font-weight: 500;
    }

    .sp-send {
      position: fixed; inset-inline: 0; inset-block-end: 0;
      background: var(--ink); color: var(--cream);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
      box-shadow: 0 -6px 24px rgba(59,42,36,.22); z-index: 20;
    }
    .sp-send__note { font-size: var(--t-label); opacity: .8; }
    .sp-btn {
      font: inherit; font-size: var(--t-small);
      border-radius: 999px; padding: 10px 22px;
      border: 1px solid transparent; cursor: pointer;
    }
    .sp-btn:disabled { opacity: .45; cursor: default; }
    .sp-btn--go { background: var(--butter); color: var(--ink); }
    .sp-btn--copy { background: transparent; color: var(--cream); border-color: rgba(246,240,228,.55); }

    .sp-said { position: fixed; inset-block-end: 80px; inset-inline: 0; text-align: center; pointer-events: none; z-index: 21; }
    .sp-said span {
      display: inline-block; background: var(--ink); color: var(--cream);
      font-size: var(--t-small); padding: 8px 16px; border-radius: 999px;
      opacity: 0; transform: translateY(6px); transition: opacity .25s ease, transform .25s ease;
    }
    .sp-said.is-on span { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .sp-said span { transition: none; } }
  </style>
</head>
<body>
  <div class="sp-wrap">
    <header class="sp-head">
      <h1 class="sp-title">בחירת תמונות לדף האג'נדה</h1>
      <p class="sp-lede">
        נוי, כל התמונות כאן הן פריימים מהסרט. בדף האג'נדה יש שלושה מקומות לתמונה.
        בחרי מקום למעלה, ואז לחצי על התמונה שאת רוצה בו.
      </p>
    </header>
  </div>

  <div class="sp-slots">
    <div class="sp-slots__row" id="spSlots"></div>
  </div>

  <div class="sp-wrap">
    <p class="sp-hint" id="spHint"></p>
    <div class="sp-grid" id="spGrid"></div>
  </div>

  <div class="sp-send">
    <span class="sp-send__note" id="spNote"></span>
    <button class="sp-btn sp-btn--go" id="spSend" type="button" disabled>שליחה לשחר בוואטסאפ</button>
    <button class="sp-btn sp-btn--copy" id="spCopy" type="button" disabled>העתקה</button>
  </div>

  <div class="sp-said" id="spSaid" aria-live="polite"><span></span></div>

  <script>
    /* Everything here comes from gallery.json or from Noy's own taps, and the
       page is built with createElement / textContent, so there is no markup to
       escape and nothing to get wrong. */
    (function () {
      'use strict';

      var STORE    = 'nuika-story-pick';
      var MANIFEST = './images/gallery/gallery.json';

      /* The film's frames, and only those. gallery.json also holds Noy's own
         photographs, and the portraits where her face fills the frame are left
         out on purpose: she asked for atmosphere, not for herself. */
      var FRAMES = [
        'hands-on-scored-loaf.jpg', 'open-sandwiches-tomato.jpg', 'round-sourdough-peel.jpg',
        'rustic-loaf-crust.jpg', 'slicing-dark-loaf.jpg', 'seeded-braid-hands.jpg',
        'slicing-scored-loaf.jpg', 'seeded-dough-balls.jpg', 'sugared-round-pastry.jpg',
        'brushing-poppy-twist.jpg', 'powdered-sugar-pastry.jpg', 'seeded-braid-oil.jpg',
        'plum-tart-plate.jpg', 'raspberry-jam-disc.jpg', 'plum-pastry-folded.jpg',
        'plums-glistening.jpg', 'vanilla-pods.jpg', 'kitchen-wide.jpg',
        'flour-dust-flowers.jpg', 'banneton-flowers.jpg', 'noy-shaping-dough.jpg'
      ];

      var SLOTS = [
        { key: 'open',   name: 'פתיחה', hint: 'התמונה הגדולה שמאחורי המשפט הראשון, על כל המסך. בטלפון היא נחתכת לפס אנכי מהאמצע.' },
        { key: 'middle', name: 'אמצע',  hint: 'התמונה שליד הפסקה הראשונה. היא נחתכת למלבן עומד מהמרכז, ככה היא מוצגת למטה.' },
        { key: 'end',    name: 'סיום',  hint: 'התמונה הכהה שמאחורי הפסקה האחרונה והכפתור "לתפריט והזמנות".' }
      ];

      var slotsEl = document.getElementById('spSlots');
      var gridEl  = document.getElementById('spGrid');
      var hintEl  = document.getElementById('spHint');
      var sendEl  = document.getElementById('spSend');
      var copyEl  = document.getElementById('spCopy');
      var noteEl  = document.getElementById('spNote');
      var saidEl  = document.getElementById('spSaid');

      var byFile = {};
      var choice = read();
      var active = 'open';

      /* Private mode throws on both; a tool that cannot remember must still open. */
      function read() {
        try { return JSON.parse(localStorage.getItem(STORE) || '{}') || {}; }
        catch (e) { return {}; }
      }
      function write() {
        try { localStorage.setItem(STORE, JSON.stringify(choice)); }
        catch (e) { /* she keeps what is on screen */ }
      }

      var sayTimer = null;
      function say(text) {
        saidEl.firstChild.textContent = text;
        saidEl.classList.add('is-on');
        clearTimeout(sayTimer);
        sayTimer = setTimeout(function () { saidEl.classList.remove('is-on'); }, 2400);
      }

      function slotOf(file) {
        for (var i = 0; i < SLOTS.length; i++) if (choice[SLOTS[i].key] === file) return SLOTS[i];
        return null;
      }
      function src(file) {
        var e = byFile[file];
        return './images/gallery/' + ((e && e.thumb) || file);
      }

      function paintSlots() {
        slotsEl.textContent = '';
        SLOTS.forEach(function (s) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'sp-slot';
          b.setAttribute('aria-pressed', String(active === s.key));

          var name = document.createElement('span');
          name.className = 'sp-slot__name';
          name.textContent = s.name;
          b.appendChild(name);

          if (choice[s.key] && byFile[choice[s.key]]) {
            var im = document.createElement('img');
            im.className = 'sp-slot__pic';
            im.src = src(choice[s.key]);
            im.alt = '';
            b.appendChild(im);
          } else {
            var em = document.createElement('span');
            em.className = 'sp-slot__empty';
            em.textContent = 'עוד לא נבחרה';
            b.appendChild(em);
          }
          b.addEventListener('click', function () { active = s.key; paintAll(); });
          slotsEl.appendChild(b);
        });
      }

      function paintGrid() {
        gridEl.textContent = '';
        gridEl.classList.toggle('is-middle', active === 'middle');
        FRAMES.forEach(function (file) {
          var e = byFile[file];
          if (!e) return;
          var t = document.createElement('button');
          t.type = 'button';
          t.className = 'sp-tile';
          var owner = slotOf(file);
          t.classList.toggle('is-picked', !!owner);

          var im = document.createElement('img');
          im.src = src(file);
          im.alt = (e.alt && e.alt.he) || '';
          im.loading = 'lazy';
          t.appendChild(im);

          if (owner) {
            var bd = document.createElement('span');
            bd.className = 'sp-badge';
            bd.textContent = owner.name;
            t.appendChild(bd);
          }
          t.addEventListener('click', function () { pick(file); });
          gridEl.appendChild(t);
        });
      }

      function pick(file) {
        var owner = slotOf(file);
        if (owner && owner.key === active) {            /* tapping her choice again takes it back */
          delete choice[active];
        } else {
          if (owner) delete choice[owner.key];           /* one photo, one place */
          choice[active] = file;
          var next = SLOTS.filter(function (s) { return !choice[s.key]; })[0];
          if (next) active = next.key;
        }
        write();
        paintAll();
      }

      function chosen() {
        return SLOTS.filter(function (s) { return choice[s.key] && byFile[choice[s.key]]; });
      }

      function paintAll() {
        paintSlots();
        paintGrid();
        var s = SLOTS.filter(function (x) { return x.key === active; })[0];
        hintEl.textContent = 'בוחרת עכשיו: ' + s.name + '. ' + s.hint;
        var n = chosen().length;
        sendEl.disabled = copyEl.disabled = n === 0;
        noteEl.textContent = n === 0 ? 'בחרי תמונה אחת לפחות'
          : n === SLOTS.length ? 'בחרת את שלושתן' : 'נבחרו ' + n + ' מתוך ' + SLOTS.length;
      }

      function message() {
        var lines = ['תמונות לדף האג\'נדה — NUIKA', ''];
        chosen().forEach(function (s) { lines.push(s.name + ': ' + choice[s.key]); });
        return lines.join('\n');
      }

      sendEl.addEventListener('click', function () {
        write();
        /* wa.me with no number opens WhatsApp's own contact picker, so Noy
           chooses Shahar herself and no private number is published here. */
        window.open('https://wa.me/?text=' + encodeURIComponent(message()), '_blank', 'noopener');
      });

      copyEl.addEventListener('click', function () {
        write();
        var text = message();
        function fallback() {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-1000px';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); say('הועתק'); }
          catch (e) { say('לא הצלחתי להעתיק'); }
          document.body.removeChild(ta);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { say('הועתק'); }, fallback);
        } else {
          fallback();
        }
      });

      fetch(MANIFEST)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          (data || []).forEach(function (e) { if (e && e.file) byFile[e.file] = e; });
          /* A stale choice from an earlier visit may name a photo that is gone. */
          SLOTS.forEach(function (s) { if (choice[s.key] && !byFile[choice[s.key]]) delete choice[s.key]; });
          var first = SLOTS.filter(function (s) { return !choice[s.key]; })[0];
          if (first) active = first.key;
          paintAll();
        })
        .catch(function () {
          hintEl.textContent = 'לא הצלחתי לטעון את התמונות. נסי לרענן.';
        });
    })();
  </script>
</body>
</html>
