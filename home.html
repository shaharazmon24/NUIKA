<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NUIKA — נואיקה</title>
  <meta name="description" content="מאפייה ארטיזנלית של אישה אחת ברחובות. לחמים, מאפים ומתוקים, בכמויות מוגבלות.">

  <!-- Loaded here, not with @import, which would block rendering. Bellefair
       carries real Hebrew; without this the page quietly falls back to Times. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=IBM+Plex+Sans+Hebrew:wght@200;300;400;500&display=swap">
  <link rel="stylesheet" href="./site.css">

  <style>
    /* The home page's own layout. Prefixed .hm- so nothing here can collide
       with another page's styles — a one-letter class did exactly that once. */
    .hm-screen {
      position: relative;
      min-block-size: 100svb;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .hm-film {
      position: absolute;
      inset: 0;
      inline-size: 100%;
      block-size: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* The film is bright and the text sits on it. Without this the words are
       unreadable wherever a shot happens to be pale — and half of them are. */
    .hm-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(to bottom, rgba(59, 42, 36, .45), rgba(59, 42, 36, .12) 38%, rgba(59, 42, 36, .68));
      pointer-events: none;
    }

    /* The film is absolutely positioned against .hm-screen, so it must not be
       given `position: relative` here too, and the three rows that sit ON it
       must be. An earlier version applied this to every child, which made
       <main> the film's containing block and squeezed it into the middle row
       with the header and footer as bars above and below. */
    .hm-screen > :not(.hm-film) { position: relative; z-index: 2; }

    /* <main> is the 1fr row of .hm-screen. It needs to be a grid itself for
       the block below to anchor to the bottom of it — `align-self: end` on a
       child of a plain block container does nothing at all, which is what was
       wrong here: the sentence sat flush under the header instead. */
    .hm-screen > main {
      display: grid;
      align-content: end;
      justify-items: center;
    }

    .hm-mid {
      text-align: center;
      color: var(--cream);
      padding-inline: 20px;
      padding-block-end: clamp(28px, 7vh, 72px);
      display: grid;
      gap: clamp(18px, 3vh, 34px);
      justify-items: center;
    }

    /* The cap that keeps the headline from running the full width of a wide
       screen belongs here, in `ch` units of THIS element's own font — the
       giant display type (u-giant, --t-giant) that actually renders the
       sentence — not on .hm-mid, which only inherits the small 17px body
       font. A cap measured in the wrong font's `ch` is a fixed pixel width
       that does not grow when --t-giant does (40px at 375 wide, 64px at
       1280), so the same box holds fewer of the bigger glyphs on a wide
       screen and wraps into MORE, choppier lines exactly where there is the
       most room — measured: 22ch anchored to the body font gave Hebrew
       2/3/4 lines and English 3/4/5 lines at 375/768/1280. Anchored here
       instead, at 16ch, both languages measure exactly 2 lines at 375, 768
       and 1280 — see task-3-report.md for the full measurement tables. */
    .hm-line { margin: 0; max-inline-size: 16ch; }
    .hm-acts { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

    /* This is the one page whose whole promise is a single screen with
       nothing to scroll to — and the one place that promise actually broke:
       .hm-screen's middle row is 1fr, but 1fr cannot shrink a row below its
       own content's height, so on a short window header + copy + footer
       simply overflow it. Landscape on a phone is exactly when this shows
       up (measured before this block existed: 812x375 ran 63px over with
       the footer clipped, 640x360 ran 59px over, also clipped; 360x640
       portrait already fit). Keyed to height, not to orientation or width:
       a short window is the actual constraint, however it got that way, and
       720px landscape and 720px-wide-mobile are two unrelated axes that
       happen to share a number in site.css — conflating them here would
       either miss a short-but-wide window or fire on a tall narrow one that
       was never broken. 480px sits with real margin above the tallest
       broken case measured (375px) and real margin below the shortest
       ordinary portrait phone (568px, iPhone SE) — including margin because
       a fold, a URL bar, or a slightly shorter device should not sit in the
       gap between "fixed" and "broken again".
       Nothing here hides the header or the footer — every element that was
       visible before is still visible, just smaller and closer together,
       per the brief's own instruction not to fix this by hiding either one. */
    @media (max-height: 480px) {
      /* Header: padding and the wordmark both shrink. 130x48 is not an
         arbitrary smaller number — it is the exact floor site.css's own
         mobile breakpoint already uses (the width below which the umbel's
         finest strokes fade out), so this never renders the mark smaller
         than the rest of the site already considers legible. Scoped to
         .hm-screen so nothing here touches the mark on any other page. */
      .hm-screen > .nu-header { padding-block: 4px; }
      .hm-screen .nu-mark__art { width: 130px; height: 48px; }

      /* Below 720px width site.css's own mobile rule takes .nu-nav out of
         the header's flex row (position: static, order: 3, width: 100%) so
         it wraps onto a visible second line — the right call on a page that
         scrolls, wrong here, where that second line is exactly what pushes
         a short screen over. Reasserting position: absolute keeps the nav
         centred over the header on its own line, out of flow, at any width,
         the same way it already behaves above 720px wide. */
      .hm-screen .nu-nav { position: absolute; inset-inline: 0; }

      /* Footer: padding, the wordmark, and the gap between items all shrink.
         108x40 keeps the mark's own 150:55 aspect ratio (within a
         fraction of a pixel); nothing in --design enforces a floor on this
         mark specifically the way it does for the header's, and at this
         size it is still clearly the same logo. Gap only ever matters here
         when the footer's four items wrap to a second row on a narrow
         width — it is what shrinks the space between those rows. */
      .hm-screen > .nu-footer { padding-block: 6px; gap: 6px; }
      .hm-screen .nu-mark--foot { width: 108px; height: 40px; }
      .hm-screen .nu-soc-row,
      .hm-screen .nu-fine,
      .hm-screen .nu-to-shop { font-size: var(--t-label); }

      /* The headline itself. Overridden as a custom property, scoped to
         .hm-screen, rather than edited in site.css's :root — this is the one
         page short enough to need a smaller giant step; every other use of
         --t-giant (there are none today, but the token is shared) keeps its
         normal clamp everywhere else. Still a real two-line headline at a
         smaller size, not a truncated one. */
      .hm-screen { --t-giant: clamp(24px, 6vh, 40px); }
      .hm-mid { gap: 6px; padding-block-end: 8px; }
    }
  </style>
</head>
<body>
  <script>
    // Noy saved this site to her home screen when the root WAS the shop. After
    // the cutover her icon lands here, on the film. The manifest's start_url
    // handles it on Android; iOS ignores start_url for an already-saved icon,
    // so the page checks for itself and sends an installed launch onward.
    //
    // Deliberately NOT a redirect for everyone: a visitor in an ordinary tab
    // is here on purpose.
    //
    // First thing in <body>, not appended to the script block at the bottom,
    // and not folded into the poster-swap block beside the <video> either.
    // Both of those sit after the film element is parsed, which means an
    // installed launch would start pulling a 10-14MB film it is about to
    // throw away, and would paint a frame of it before leaving. Here the
    // replace happens before the parser has reached the <video> at all, so
    // the only thing Noy's icon costs her is this page's markup.
    //
    // Two conditions because a visitor only ever has one of them: Chrome on
    // Android reports an installed launch through the display-mode media
    // feature and leaves navigator.standalone undefined, while iOS Safari
    // sets navigator.standalone and has never supported display-mode. The
    // matchMedia guard is for the same reason every other matchMedia call on
    // this page has one — an old WebView without it must fall through to the
    // iOS branch rather than throw here and take the page down.
    //
    // === with true, not a truthy test: navigator.standalone is undefined in
    // every desktop browser, which is falsy and correct, but pinning the
    // comparison keeps this from ever being satisfied by some future
    // non-boolean value on that property.
    //
    // location.search and location.hash are carried through, and that is NOT
    // tidiness — dropping the query silently breaks Noy's OTHER home-screen
    // icon. admin.html exists for one reason: to be an icon that lands on the
    // admin sign-in. Its whole body is location.replace('./?admin'), and its
    // own comment records that saving /?admin directly once "produced an icon
    // that opened the storefront" — a bug that has already been found and
    // fixed once. After the cutover the root IS this page, so that icon's
    // chain runs admin.html -> ./?admin -> here. The shop gates the panel on
    // `new URLSearchParams(location.search).has('admin')` (index.html, in
    // checkAdminAccess()), so a bare './shop.html' here arrives with no query,
    // no panel opens, and Noy gets the customer storefront instead of her own
    // admin — the same fixed bug, returning by a new route. Measured, not
    // theorised: with a bare target the destination reports
    // admin_query_present: false. manifest.json's "./?admin" shortcut breaks
    // the same way and is migrated in the cutover commit; this line is what
    // repairs admin.html without touching admin.html at all.
    // Do not "simplify" this back to a bare string.
    var installed = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                 || window.navigator.standalone === true;
    if (installed) { location.replace('./shop.html' + location.search + location.hash); }
  </script>
  <div class="hm-screen">
    <!-- Two cuts, not one file scaled. A phone frame keeps about a fifth of
         the picture's width, so the phone cut is a real vertical re-edit with
         its own window on each of the film's 52 shots. `media` picks between
         them before either is fetched, so only one is ever downloaded. A
         direct child of .hm-screen, not of <main>: absolutely positioned
         against the screen so it fills it, with the header/main/footer laid
         on top of it — see the .hm-screen > :not(.hm-film) rule above. -->
    <video class="hm-film" id="hm-film"
           muted playsinline preload="metadata"
           poster="./media/film-poster.jpg"
           aria-hidden="true">
      <source src="./media/film-phone.mp4"   type="video/mp4" media="(max-width: 720px)">
      <source src="./media/film-desktop.mp4" type="video/mp4">
    </video>
    <script>
      // The poster is not a placeholder. For anyone whose browser refuses to
      // autoplay, or who asked for less data, it is the page. So a phone gets
      // the phone-shaped frame, not the wide one cropped to a sliver.
      (function () {
        var v = document.getElementById('hm-film');
        if (v && window.matchMedia('(max-width: 720px)').matches)
          v.poster = './media/film-poster-phone.jpg';
      })();
    </script>
    <header class="nu-header nu-header--on-film" data-nuika-header=""></header>
    <main>
      <div class="hm-mid rise">
        <p class="hm-line u-giant">
          <span lang-content="he">אופה מה שאני הכי רוצה לאכול</span>
          <span lang-content="en">I bake what I most want to eat</span>
        </p>
        <div class="hm-acts">
          <a class="btn btn--on-film" href="./shop.html">
            <span lang-content="he">למאפייה של NUIKA</span>
            <span lang-content="en">To the NUIKA bakery</span>
          </a>
          <a class="btn btn--ghost" href="./contact.html">
            <span lang-content="he">דברו איתי</span>
            <span lang-content="en">Talk to me</span>
          </a>
        </div>
      </div>
    </main>
    <footer class="nu-footer" data-nuika-footer></footer>
  </div>
  <script src="./site.js?v=2"></script>
  <script>
    // The film is decoration. Everything below is about not making it a cost
    // to somebody who did not ask for it.
    (function () {
      var film = document.getElementById('hm-film');
      if (!film) return;

      var quiet = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var thrifty = navigator.connection && navigator.connection.saveData;

      if (quiet || thrifty) {
        // The poster already shows. Do not fetch 10-14MB to replace it.
        film.removeAttribute('preload');
        film.setAttribute('preload', 'none');
        return;
      }

      film.play().catch(function () {
        // iOS in low power mode refuses autoplay outright. The poster is
        // already on screen and stays; there is nothing to recover from.
      });

      // A film playing to nobody is somebody's data and somebody's battery.
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) film.pause();
        else film.play().catch(function () {});
      });
    })();
  </script>
</body>
</html>
