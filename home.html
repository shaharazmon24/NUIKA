<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NUIKA — נואיקה</title>
  <meta name="description" content="מאפייה ארטיזנלית של אישה אחת ברחובות. לחמים, מאפים ומתוקים, בכמויות מוגבלות.">

  <!-- Loaded here, not with @import, which would block rendering. Bellefair
       carries real Hebrew; without this the page quietly falls back to Times. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=IBM+Plex+Sans+Hebrew:wght@200;300;400;500&display=swap">
  <link rel="stylesheet" href="./site.css">

  <style>
    /* The home page's own layout. Prefixed .hm- so nothing here can collide
       with another page's styles — a one-letter class did exactly that once. */
    .hm-screen {
      position: relative;
      min-block-size: 100svb;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .hm-film {
      position: absolute;
      inset: 0;
      inline-size: 100%;
      block-size: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* The film is bright and the text sits on it. Without this the words are
       unreadable wherever a shot happens to be pale — and half of them are. */
    .hm-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(to bottom, rgba(59, 42, 36, .45), rgba(59, 42, 36, .12) 38%, rgba(59, 42, 36, .68));
      pointer-events: none;
    }

    /* The film is absolutely positioned against .hm-screen, so it must not be
       given `position: relative` here too, and the three rows that sit ON it
       must be. An earlier version applied this to every child, which made
       <main> the film's containing block and squeezed it into the middle row
       with the header and footer as bars above and below. */
    .hm-screen > :not(.hm-film) { position: relative; z-index: 2; }

    /* <main> is the 1fr row of .hm-screen. It needs to be a grid itself for
       the block below to anchor to the bottom of it — `align-self: end` on a
       child of a plain block container does nothing at all, which is what was
       wrong here: the sentence sat flush under the header instead. */
    .hm-screen > main {
      display: grid;
      align-content: end;
      justify-items: center;
    }

    .hm-mid {
      text-align: center;
      color: var(--cream);
      padding-inline: 20px;
      padding-block-end: clamp(28px, 7vh, 72px);
      display: grid;
      gap: clamp(18px, 3vh, 34px);
      justify-items: center;
    }

    /* The cap that keeps the headline from running the full width of a wide
       screen belongs here, in `ch` units of THIS element's own font — the
       giant display type (u-giant, --t-giant) that actually renders the
       sentence — not on .hm-mid, which only inherits the small 17px body
       font. A cap measured in the wrong font's `ch` is a fixed pixel width
       that does not grow when --t-giant does (40px at 375 wide, 64px at
       1280), so the same box holds fewer of the bigger glyphs on a wide
       screen and wraps into MORE, choppier lines exactly where there is the
       most room — measured: 22ch anchored to the body font gave Hebrew
       2/3/4 lines and English 3/4/5 lines at 375/768/1280. Anchored here
       instead, at 16ch, both languages measure exactly 2 lines at 375, 768
       and 1280 — see task-3-report.md for the full measurement tables. */
    .hm-line { margin: 0; max-inline-size: 16ch; }
    .hm-acts { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <div class="hm-screen">
    <!-- Two cuts, not one file scaled. A phone frame keeps about a fifth of
         the picture's width, so the phone cut is a real vertical re-edit with
         its own window on each of the film's 52 shots. `media` picks between
         them before either is fetched, so only one is ever downloaded. A
         direct child of .hm-screen, not of <main>: absolutely positioned
         against the screen so it fills it, with the header/main/footer laid
         on top of it — see the .hm-screen > :not(.hm-film) rule above. -->
    <video class="hm-film" id="hm-film"
           muted playsinline preload="metadata"
           poster="./media/film-poster.jpg"
           aria-hidden="true">
      <source src="./media/film-phone.mp4"   type="video/mp4" media="(max-width: 720px)">
      <source src="./media/film-desktop.mp4" type="video/mp4">
    </video>
    <script>
      // The poster is not a placeholder. For anyone whose browser refuses to
      // autoplay, or who asked for less data, it is the page. So a phone gets
      // the phone-shaped frame, not the wide one cropped to a sliver.
      (function () {
        var v = document.getElementById('hm-film');
        if (v && window.matchMedia('(max-width: 720px)').matches)
          v.poster = './media/film-poster-phone.jpg';
      })();
    </script>
    <header class="nu-header nu-header--on-film" data-nuika-header=""></header>
    <main>
      <div class="hm-mid rise">
        <p class="hm-line u-giant">
          <span lang-content="he">אופה מה שאני הכי רוצה לאכול</span>
          <span lang-content="en">I bake what I most want to eat</span>
        </p>
        <div class="hm-acts">
          <a class="btn btn--on-film" href="./shop.html">
            <span lang-content="he">למאפייה של NUIKA</span>
            <span lang-content="en">To the NUIKA bakery</span>
          </a>
          <a class="btn btn--ghost" href="./contact.html">
            <span lang-content="he">דברו איתי</span>
            <span lang-content="en">Talk to me</span>
          </a>
        </div>
      </div>
    </main>
    <footer class="nu-footer" data-nuika-footer></footer>
  </div>
  <script src="./site.js"></script>
  <script>
    // The film is decoration. Everything below is about not making it a cost
    // to somebody who did not ask for it.
    (function () {
      var film = document.getElementById('hm-film');
      if (!film) return;

      var quiet = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var thrifty = navigator.connection && navigator.connection.saveData;

      if (quiet || thrifty) {
        // The poster already shows. Do not fetch 10-14MB to replace it.
        film.removeAttribute('preload');
        film.setAttribute('preload', 'none');
        return;
      }

      film.play().catch(function () {
        // iOS in low power mode refuses autoplay outright. The poster is
        // already on screen and stays; there is nothing to recover from.
      });

      // A film playing to nobody is somebody's data and somebody's battery.
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) film.pause();
        else film.play().catch(function () {});
      });
    })();
  </script>
</body>
</html>
